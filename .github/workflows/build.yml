name: Build minified library

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach assets to (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && !inputs.release_tag }}

jobs:
  build:
    name: Build and package assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Build minified assets and C headers
        run: python tools/build.py

      - name: Verify build and distribution
        run: |
          python tools/build.py --check
          python -m unittest tests.test_server tests.test_build -v

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: turbo-sse-dist
          path: |
            dist/turbo-sse.min.js
            dist/turbo-sse.min.js.gz
            dist/turbo-sse.css
            dist/turbo-sse.css.gz
            dist/turbo-sse.h
            dist/turbo-sse-gzip.h
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach release assets
    needs: build
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@v8
        with:
          name: turbo-sse-dist
          path: dist

      - name: Upload files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/turbo-sse.min.js \
            dist/turbo-sse.min.js.gz \
            dist/turbo-sse.css \
            dist/turbo-sse.css.gz \
            dist/turbo-sse.h \
            dist/turbo-sse-gzip.h \
            --clobber
