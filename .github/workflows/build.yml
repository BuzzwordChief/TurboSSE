name: Build minified library

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Build minified assets and C headers
        run: python tools/build.py

      - name: Verify build and distribution
        run: |
          python tools/build.py --check
          python -m unittest tests.test_server tests.test_build -v

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: turbo-sse-dist
          path: |
            dist/turbo-sse.min.js
            dist/turbo-sse.min.js.gz
            dist/turbo-sse.css
            dist/turbo-sse.css.gz
            dist/turbo-sse.h
            dist/turbo-sse-gzip.h
          if-no-files-found: error
          retention-days: 30
